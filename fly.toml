# fly.toml app configuration file
app = 'asistencias-de-docentes-con-qr'
primary_region = 'gru'

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "America/Lima"
  TZ_NAME = "America/Lima"
  MAX_DOCENTES = "40"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = "uploads_data"
  destination = "/app/app/static/uploads"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024