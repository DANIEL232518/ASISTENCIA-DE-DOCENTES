services:
  db:
    image: postgres:16-alpine
    container_name: asistencia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: asistencia
      POSTGRES_PASSWORD: academia2026
      POSTGRES_DB: asistencia
      TZ: America/Lima
      PGTZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistencia -d asistencia"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - asistencia_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asistencia_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://asistencia:academia2026@db:5432/asistencia
      JWT_SECRET: clave-secreta-cambiar-en-produccion-9f2b7c1d
      JWT_MINUTOS: "720"
      TZ: America/Lima
      TZ_NAME: America/Lima
      # URL con la que se generan los QR de las credenciales. Sobrescríbela cuando
      # publiques la app (HTTPS o IP de la red local), p. ej.:
      #   set BASE_URL=https://mi-dominio.com  &&  docker compose up -d
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      MAX_DOCENTES: "40"
      LOG_LEVEL: info
    volumes:
      - uploads:/app/app/static/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4)",
        ]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 25s
    networks:
      - asistencia_net

volumes:
  pgdata:
  uploads:

networks:
  asistencia_net:
    driver: bridge
